# ── Renders ──────────────────────────────────────────────────
# Lista de grupos de renders. Cada grupo tiene:
#   claves: lista de códigos que activan este grupo
#   carpeta: ruta relativa a knowledge/
#   imagenes: lista de archivos de imagen dentro de la carpeta
#   video: archivo de video dentro de la carpeta (null si no hay)
renders:
  - claves: ["401", "d401", "d-401"]
    carpeta: "renders/render-401"
    imagenes:
      - "Renders-TF.jpg"
      - "sala.jpg"
      - "sala-comedor.jpg"
      - "cocina.jpg"
      - "bano.jpg"
      - "hab1.jpg"
      - "hab2.jpg"
    video: "video-401.mp4"

