# ============================================================
# config/business.yaml — Configuración del negocio
# ============================================================
# Este archivo es la ÚNICA fuente de verdad para configurar
# el agente. No hay que tocar código Python para adaptarlo
# a un nuevo cliente — solo editar este archivo.
# ============================================================

negocio:
  nombre: "TORRE FUERTE APARTAMENTOS"
  nombre_corto: "Torre Fuerte"        # Usado en emails, mensajes automáticos y subjects
  descripcion: >
    Torre Fuerte es un proyecto residencial de lujo ubicado en Laureles, Medellín,
    desarrollado por CUATRO ONCE y construido por Laureles 21. Es un edificio exclusivo
    de solo 21 apartamentos, pensado para quienes buscan vivir o invertir en uno de los
    sectores más tradicionales, valorizados y apetecidos de Medellín.
  horario: "Lunes a domingo, 24/7"
  ubicacion: "Laureles, Medellín, Colombia"
  desarrollador: "CUATRO ONCE"
  constructor: "Laureles 21"

agente:
  nombre: "Torre Fuerte"
  tono: "Profesional y formal"
  casos_de_uso:
    - "Calificar y atender leads / ventas"
    - "Responder preguntas frecuentes"
    - "Agendar citas o visitas al proyecto"

# ── Logo ─────────────────────────────────────────────────────
# Archivo relativo a la carpeta knowledge/
# Poner null para deshabilitar el envío del logo al inicio.
logo:
  archivo: "TF-LOGO.jpg"

# ── Excel ────────────────────────────────────────────────────
excel:
  hoja_leads: "Leads Torre Fuerte"
  hoja_visitas: "Visitas Torre Fuerte"

# ── Planos ───────────────────────────────────────────────────
# Mapeo de código de apartamento → archivo PDF
# Todos los archivos son relativos a knowledge/planos/
# Agregar aliases (ej: "todo" y "todos") según necesidad.
planos:
