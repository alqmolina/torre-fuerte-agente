# ── Mensajes automáticos ─────────────────────────────────────
# Todos los mensajes que el agente envía automáticamente
# (seguimiento, recordatorios, handoff).
#
# Placeholders disponibles:
#   {nombre}  → nombre del lead
#   {negocio} → nombre_corto del negocio
#   {fecha}   → fecha formateada (solo recordatorios)
#   {hora}    → hora de la visita (solo recordatorios)
mensajes:

  seguimiento:
    es:
      caliente:
        - "¡Hola {nombre}! 👋 Solo quería hacer seguimiento a tu consulta sobre {negocio}. ¿Pudiste revisar la información que te compartí? Estoy aquí para resolver cualquier duda 🏠✨"
        - "¡Hola {nombre}! 😊 Los apartamentos de {negocio} tienen disponibilidad limitada. ¿Te gustaría agendar una visita al proyecto o hablar con uno de nuestros asesores?"
      tibio:
        - "¡Hola {nombre}! 👋 Quería recordarte que en {negocio} seguimos disponibles para ayudarte. ¿Tienes alguna pregunta pendiente sobre el proyecto? 🏠"
        - "¡Hola {nombre}! 😊 Este es nuestro último mensaje de seguimiento. Si decides retomar tu búsqueda, estaremos encantados de ayudarte. ¡Que tengas un excelente día!"
      frio:
        - "¡Hola {nombre}! 👋 Vimos que estuviste conociendo {negocio}. Si tienes alguna pregunta o quieres más información, con gusto te ayudamos 🏠"
        - "¡Hola {nombre}! 😊 Este es nuestro último mensaje. Si en algún momento retomas tu búsqueda, {negocio} tiene opciones únicas esperándote. ¡Mucho éxito!"
    en:
      caliente:
        - "Hi {nombre}! 👋 Just following up on your inquiry about {negocio}. Did you get a chance to review the information I shared? I'm here to answer any questions 🏠✨"
        - "Hi {nombre}! 😊 Our units at {negocio} have limited availability. Would you like to schedule a visit or speak with one of our advisors?"
      tibio:
        - "Hi {nombre}! 👋 Just a reminder that we're here to help at {negocio}. Do you have any pending questions about the project? 🏠"
        - "Hi {nombre}! 😊 This is our last follow-up message. If you ever decide to resume your search, we'd love to hear from you. Have a great day!"
      frio:
        - "Hi {nombre}! 👋 We noticed you were exploring {negocio}. If you have any questions or would like more information, we're happy to help 🏠"
        - "Hi {nombre}! 😊 This is our last message. If you ever resume your search, {negocio} has unique options waiting for you. Best of luck!"

  handoff_automatico:
    es: "¡Hola {nombre}! 👋 Un asesor de {negocio} se pondrá en contacto contigo muy pronto para continuar con tu consulta. 🏠✨"
    en: "Hi {nombre}! 👋 A {negocio} advisor will reach out to you shortly to continue with your inquiry. 🏠✨"

  recordatorio_visita:
    es:
      dia_antes: "¡Hola {nombre}! 👋 Te recordamos que mañana tienes una visita al proyecto {negocio}:\n\n📅 {fecha}\n⏰ {hora}\n\n¡Te esperamos! Si necesitas reprogramar, escríbenos aquí."
      una_hora: "¡Hola {nombre}! ⏰ En aproximadamente 1 hora tienes tu visita a {negocio} ({hora}). ¡Nos vemos pronto! 🏠✨"
    en:
      dia_antes: "Hi {nombre}! 👋 Reminder: tomorrow you have a visit to {negocio}:\n\n📅 {fecha}\n⏰ {hora}\n\nWe look forward to seeing you! To reschedule, just reply here."
      una_hora: "Hi {nombre}! ⏰ Your visit to {negocio} is in about 1 hour ({hora}). See you soon! 🏠✨"

metadata:
