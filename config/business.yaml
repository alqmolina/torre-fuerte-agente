# ============================================================
# config/business.yaml — Configuración del negocio
# ============================================================
# Este archivo es la ÚNICA fuente de verdad para configurar
# el agente. No hay que tocar código Python — solo edita aquí.
#
# PLACEHOLDERS disponibles en mensajes:
#   {nombre}  → nombre del lead
#   {negocio} → nombre_corto del negocio
#   {fecha}   → fecha de la cita (solo recordatorios)
#   {hora}    → hora de la cita (solo recordatorios)
# ============================================================

negocio:
  nombre: "NOMBRE DE TU NEGOCIO"          # Nombre completo (aparece en emails)
  nombre_corto: "Mi Negocio"              # Nombre corto (aparece en mensajes al cliente)
  descripcion: "Describe aquí tu negocio: qué ofreces, a quién va dirigido, dónde estás."
  horario: "Lunes a Viernes 8am a 6pm"
  ubicacion: "Ciudad, País"

agente:
  nombre: "Asistente"                     # Nombre que verán tus clientes
  tono: "Profesional y amigable"
  casos_de_uso:
    - "Responder preguntas frecuentes"
    - "Calificar y atender leads"
    - "Agendar citas"

# ── Logo ─────────────────────────────────────────────────────
# Archivo del logo relativo a knowledge/ (ej: "logo.jpg")
# El agente lo envía al inicio de cada conversación nueva.
# Usa null para no enviar logo.
logo:
  archivo: null

# ── Excel ────────────────────────────────────────────────────
excel:
  hoja_leads: "Leads"
  hoja_visitas: "Citas"

# ── Catálogo (opcional) ───────────────────────────────────────
# Define aquí tus productos o servicios si quieres que el agente
# pueda enviar archivos (PDF, imágenes) cuando el cliente los pida.
#
# Claude usa el marcador [PLANO:codigo] para enviar un archivo
# y [RENDER:codigo] para enviar un grupo de imágenes.
#
# Ejemplos de uso:
#   Inmobiliaria → planos de apartamentos, renders del proyecto
#   Restaurante  → menú PDF, fotos de platos
#   Clínica      → información de tratamientos, imágenes de instalaciones
#
# planos:
#   "menu": "menu-restaurante.pdf"
#   "instalaciones": "instalaciones.pdf"
#
# renders:
#   - claves: ["platos", "menu-fotos"]
#     carpeta: "renders/platos"
#     imagenes:
#       - "plato1.jpg"
#       - "plato2.jpg"
#     video: null

# ── Disponibilidad / Catálogo de items (opcional) ─────────────
# Lista de productos, servicios o unidades disponibles.
# El agente puede consultar esta info para responder preguntas.
#
# disponibilidad:
#   - item: "Servicio Premium"
#     precio: 500000
#     descripcion: "Descripción del servicio"
#   - item: "Servicio Básico"
#     precio: 200000
#     descripcion: "Descripción del servicio"

# ── Mensajes automáticos ─────────────────────────────────────
mensajes:

  seguimiento:
    es:
      caliente:
        - "¡Hola {nombre}! 👋 Solo quería hacer seguimiento a tu consulta sobre {negocio}. ¿Pudiste revisar la información que te compartí? Estoy aquí para resolver cualquier duda 😊"
        - "¡Hola {nombre}! 😊 ¿Te gustaría agendar una cita o hablar con uno de nuestros asesores? Seguimos disponibles para ayudarte."
      tibio:
        - "¡Hola {nombre}! 👋 Quería recordarte que en {negocio} seguimos disponibles para ayudarte. ¿Tienes alguna pregunta pendiente?"
        - "¡Hola {nombre}! 😊 Este es nuestro último mensaje de seguimiento. Si decides retomar tu consulta, estaremos encantados de ayudarte. ¡Que tengas un excelente día!"
      frio:
        - "¡Hola {nombre}! 👋 Vimos que estuviste consultando sobre {negocio}. Si tienes alguna pregunta o quieres más información, con gusto te ayudamos."
        - "¡Hola {nombre}! 😊 Este es nuestro último mensaje. Si en algún momento retomas tu consulta, estamos aquí. ¡Mucho éxito!"
    en:
      caliente:
        - "Hi {nombre}! 👋 Just following up on your inquiry about {negocio}. Did you get a chance to review the information I shared? I'm here to help 😊"
        - "Hi {nombre}! 😊 Would you like to schedule an appointment or speak with one of our advisors?"
      tibio:
        - "Hi {nombre}! 👋 Just a reminder that {negocio} is here to help. Do you have any pending questions?"
        - "Hi {nombre}! 😊 This is our last follow-up message. If you ever decide to resume your inquiry, we'd love to hear from you. Have a great day!"
      frio:
        - "Hi {nombre}! 👋 We noticed you were inquiring about {negocio}. If you have any questions, we're happy to help."
        - "Hi {nombre}! 😊 This is our last message. If you ever resume your inquiry, {negocio} is here for you. Best of luck!"

  handoff_automatico:
    es: "¡Hola {nombre}! 👋 Un asesor de {negocio} se pondrá en contacto contigo muy pronto para continuar con tu consulta. 😊"
    en: "Hi {nombre}! 👋 A {negocio} advisor will reach out to you shortly to continue with your inquiry. 😊"

  recordatorio_visita:
    es:
      dia_antes: "¡Hola {nombre}! 👋 Te recordamos que mañana tienes una cita con {negocio}:\n\n📅 {fecha}\n⏰ {hora}\n\n¡Te esperamos! Si necesitas reprogramar, escríbenos aquí."
      una_hora: "¡Hola {nombre}! ⏰ En aproximadamente 1 hora tienes tu cita con {negocio} ({hora}). ¡Nos vemos pronto! 😊"
    en:
      dia_antes: "Hi {nombre}! 👋 Reminder: tomorrow you have an appointment with {negocio}:\n\n📅 {fecha}\n⏰ {hora}\n\nWe look forward to seeing you! To reschedule, just reply here."
      una_hora: "Hi {nombre}! ⏰ Your appointment with {negocio} is in about 1 hour ({hora}). See you soon! 😊"

metadata:
  version: "2.0"
